name: Radar diario de licitaciones

on:
  schedule:
    # 10:17 UTC = 06:17 en Chile (07:17 en horario de verano).
    # Hora "rara" y temprana a proposito: GitHub encola las tareas gratuitas y las
    # horas en punto son las mas congestionadas, asi el correo llega en la manana
    # aunque se retrase un par de horas.
    - cron: "17 10 * * *"
  workflow_dispatch:        # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write           # para guardar los datos nuevos en el repositorio
  pages: write              # para publicar la web
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  actualizar-y-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Consultar Mercado Público
        env:
          MP_TICKET: ${{ secrets.MP_TICKET }}
        run: python scripts/actualizar.py

      - name: Armar el Excel y enviar el correo
        continue-on-error: true   # si el correo falla, igual publicamos la web
        env:
          CORREO_USUARIO: ${{ secrets.CORREO_USUARIO }}
          CORREO_CLAVE: ${{ secrets.CORREO_CLAVE }}
          CORREO_PARA: ${{ secrets.CORREO_PARA }}
        run: python scripts/enviar_correo.py

      - name: Guardar los datos nuevos
        run: |
          git config user.name "Radar de licitaciones"
          git config user.email "actions@github.com"
          git add web/datos web/descargas
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar."
          else
            git commit -m "Radar: datos del $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Publicar la web
        id: publicacion
        uses: actions/deploy-pages@v4
